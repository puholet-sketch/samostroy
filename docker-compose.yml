# СамоСтрой — локальный pro-stack (всё на этом ПК).
#
#   docker compose up -d
#   # API: http://127.0.0.1:8787/health
#   # Postgres: localhost:5433
#
# CRM (Vite): в .env или Настройки → Замечания / API
#   VITE_FEEDBACK_API_URL=http://127.0.0.1:8787
#   VITE_FEEDBACK_API_TOKEN=local-dev-token
#
# GitHub Pages → этот API с интернета НЕ достучится (localhost). Нужен туннель
# или API на сервере. Telegram/Web3Forms — опциональный notify.

services:
  postgres:
    image: postgres:16-alpine
    container_name: samostroy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: samostroy
      POSTGRES_PASSWORD: samostroy
      POSTGRES_DB: samostroy
    ports:
      # 5433 на хосте — если локальный Postgres уже занял 5432
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - feedback_images:/var/lib/samostroy/feedback-images
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U samostroy -d samostroy']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./bots/feedback-bot
    container_name: samostroy-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8787:8787'
    environment:
      PORT: '8787'
      FEEDBACK_TOKEN: ${FEEDBACK_TOKEN:-local-dev-token}
      DATABASE_URL: postgres://samostroy:samostroy@postgres:5432/samostroy
      FEEDBACK_IMAGES_DIR: /data/images
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - feedback_images:/data/images

volumes:
  pgdata:
  feedback_images:
