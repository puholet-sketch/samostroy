# URL-only update of Pages api-config.json (no Vite rebuild).
# Trigger: repository_dispatch samostroy_api_url from Lenovo watchdog / publish-api-config.sh
# Or: gh workflow run update-api-config.yml -f api_base=https://…
name: Update API config

on:
  repository_dispatch:
    types: [samostroy_api_url]
  workflow_dispatch:
    inputs:
      api_base:
        description: Public HTTPS API base (no trailing slash)
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve API base
        id: url
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            BASE='${{ github.event.client_payload.api_base }}'
          else
            BASE='${{ inputs.api_base }}'
          fi
          BASE="${BASE%/}"
          case "$BASE" in
            https://*) ;;
            *) echo "Invalid api_base: $BASE"; exit 1 ;;
          esac
          echo "api_base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Write api-config.json
        run: |
          set -euo pipefail
          BASE='${{ steps.url.outputs.api_base }}'
          printf '%s\n' "{\"apiBase\":\"${BASE}\"}" > api-config.json
          cat api-config.json

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "samostroy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-config.json
          if git diff --staged --quiet; then
            echo "api-config.json unchanged"
            exit 0
          fi
          git commit -m "chore: api-config ${{ steps.url.outputs.api_base }}"
          git push origin HEAD:gh-pages
